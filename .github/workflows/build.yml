name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DJPR_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build -j
      - name: test
        run: ctest --test-dir build --output-on-failure

  mod:
    name: libjpr.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64, armeabi-v7a, x86]
    steps:
      - uses: actions/checkout@v4

      # The runner ships an NDK already. Use it rather than downloading one:
      # a third party action with a local cache can restore a half populated
      # directory, which fails later and confusingly at compiler detection.
      - name: locate the NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -n "$NDK" || { echo "no NDK on this runner"; exit 1; }
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -x "$CLANG" || { echo "NDK at $NDK has no clang++ at $CLANG"; ls -la "$NDK"; exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "using NDK $NDK"

      - name: configure
        run: |
          cmake -S . -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build-${{ matrix.abi }} -j

      - name: check the entry points are exported
        run: |
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" --dynamic --defined-only build-${{ matrix.abi }}/libjpr.so | grep -E 'mod_init|mod_preinit'

      - name: stage the release layout
        run: |
          mkdir -p out/jpr/signatures
          cp build-${{ matrix.abi }}/libjpr.so out/
          cp config/jpr.json out/jpr/
          cp signatures/*.json out/jpr/signatures/ 2>/dev/null || true
          cp README.md out/jpr/

      - uses: actions/upload-artifact@v4
        with:
          name: jpr-${{ matrix.abi }}
          path: out/
